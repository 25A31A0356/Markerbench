services:
  postgres:
    image: postgres:16-alpine
    container_name: makerbench-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: makerbench
      POSTGRES_PASSWORD: makerbench_dev_change_me
      POSTGRES_DB: makerbench

    ports:
      - "5432:5432"

    volumes:
      - makerbench_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U makerbench -d makerbench"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  makerbench_postgres_data:
